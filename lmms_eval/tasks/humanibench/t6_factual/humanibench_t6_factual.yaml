dataset_name: task6_Empathetic_Captioning
task: humanibench_t6_factual
include: ../_default_template_yaml
doc_to_visual: !function utils_t6_factual.doc_to_visual
doc_to_text: !function utils_t6_factual.doc_to_text
doc_to_messages: !function utils_t6_factual.doc_to_messages
doc_to_target: "simple_prompt"
process_results: !function utils_t6_factual.process_results
metric_list:
  - metric: accuracy
    aggregation: !function utils_t6_factual.aggregate_accuracy
    higher_is_better: true
  - metric: bias
    aggregation: !function utils_t6_factual.aggregate_bias
    higher_is_better: false
  - metric: hallucination
    aggregation: !function utils_t6_factual.aggregate_hallucination
    higher_is_better: false
  - metric: faithfulness
    aggregation: !function utils_t6_factual.aggregate_faithfulness
    higher_is_better: true
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: ""
