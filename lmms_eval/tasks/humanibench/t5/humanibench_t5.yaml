dataset_name: task5_Visual_Grounding
task: humanibench_t5
include: ../_default_template_yaml
process_results_use_image: true
doc_to_visual: !function utils_t5.doc_to_visual
doc_to_text: !function utils_t5.doc_to_text
doc_to_messages: !function utils_t5.doc_to_messages
doc_to_target: "bbox"
process_results: !function utils_t5.process_results
metric_list:
  - metric: mean_iou
    aggregation: !function utils_t5.aggregate_mean_iou
    higher_is_better: true
  - metric: map50
    aggregation: !function utils_t5.aggregate_map50
    higher_is_better: true
  - metric: map75
    aggregation: !function utils_t5.aggregate_map75
    higher_is_better: true
  - metric: missing
    aggregation: !function utils_t5.aggregate_missing
    higher_is_better: false
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: ""
