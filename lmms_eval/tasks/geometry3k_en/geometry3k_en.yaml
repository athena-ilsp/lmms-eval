dataset_path: hiyouga/geometry3k
dataset_kwargs:
  token: True
task: "geometry3k_en"
test_split: test
output_type: generate_until
doc_to_visual: !function utils.geometry3k_en_doc_to_visual
doc_to_text: !function utils.geometry3k_en_doc_to_text
doc_to_target: "answer"
generation_kwargs:
  max_new_tokens: 512
  temperature: 0
  top_p: 1.0
  num_beams: 1
  do_sample: false
process_results: !function utils.geometry3k_en_process_results
metric_list:
  - metric: exact_match
    aggregation: !function utils.geometry3k_en_aggregate_results
    higher_is_better: true
metadata:
  version: 0.0
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: "\nSolve the geometry problem. At the end of your response, write the final answer in the format:\nAnswer: (the final answer)"