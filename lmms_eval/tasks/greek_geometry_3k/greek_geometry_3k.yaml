dataset_path: ilsp/greek-geometry-3k
dataset_kwargs:
  token: True
task: "greek_geometry_3k"
test_split: test
output_type: generate_until
doc_to_visual: !function utils.greek_geometry_doc_to_visual
doc_to_text: !function utils.greek_geometry_doc_to_text
doc_to_target: "answer"
generation_kwargs:
  max_new_tokens: 512
  temperature: 0
  top_p: 1.0
  num_beams: 1
  do_sample: false
process_results: !function utils.greek_geometry_process_results
metric_list:
  - metric: exact_match
    aggregation: !function utils.greek_geometry_aggregate_results
    higher_is_better: true
metadata:
  version: 0.0
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: "\nΛύσε το πρόβλημα γεωμετρίας. Στο τέλος της απάντησής σου, γράψε την τελική απάντηση στη μορφή:\nΑπάντηση: (η τελική απάντηση)"